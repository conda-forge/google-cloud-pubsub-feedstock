schema_version: 1

context:
  name: google-cloud-pubsub
  version: "2.39.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/google_cloud_pubsub-${{ version }}.tar.gz
  sha256: eed65e25f57f95bf3e02d96d7ee171688b23922471f9f21b5a91ed90e1282c0f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - google-api-core >=2.11.0,<3.0.0
    - google-api-core-grpc
    - google-auth >=2.14.1,<3.0.0,!=2.24.0,!=2.25.0
    # more restrictive constraint for python <3.14
    - grpcio >=1.51.3,<2.0.0
    # more restrictive constraint for python >=3.13
    - proto-plus >=1.25.0,<2.0.0
    - protobuf >=4.25.8,<8.0.0
    - grpc-google-iam-v1 >=0.14.0,<1.0.0
    - grpcio-status >=1.33.2
    - opentelemetry-api >=1.27.0
    - opentelemetry-sdk >=1.27.0
    - libcst >=0.3.10

tests:
  - python:
      imports:
        - google.api_core
        - google.cloud.pubsub
        - grpc
      python_version: ${{ python_min }}.*
      pip_check: true

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Python Client for Google Cloud Pub / Sub
  description: |
    Google Cloud Pub / Sub is a fully-managed real-time messaging service that
    allows you to send and receive messages between independent applications.
    You can leverage Cloud Pub/Sub’s flexibility to decouple systems and
    components hosted on Google Cloud Platform or elsewhere on the Internet. By
    building on the same technology Google uses, Cloud Pub / Sub is designed to
    provide “at least once” delivery at low latency with on-demand scalability
    to 1 million messages per second (and beyond).
  homepage: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-pubsub
  repository: https://github.com/googleapis/google-cloud-python/tree/main/packages/google-cloud-pubsub
  documentation: https://docs.cloud.google.com/python/docs/reference/pubsub/latest

extra:
  recipe-maintainers:
    - xylar
    - hmaarrfk
    - tpdownes
    - tswast
